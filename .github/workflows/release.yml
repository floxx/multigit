name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: packaging/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package
        id: package
        run: |
          name="multigit-${{ steps.version.outputs.version }}-x86_64-linux"
          mkdir "$name"
          cp target/x86_64-unknown-linux-gnu/release/multigit "$name/"
          cp packaging/linux/install.sh packaging/linux/io.github.paxel.multigit.desktop "$name/"
          cp assets/icon_256.png README.md CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" \
            --title "multigit ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
