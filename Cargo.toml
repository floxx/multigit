[package]
name = "multigit"
version = "0.1.0"
edition = "2024"
description = "Desktop dashboard for many git repositories"
publish = false

[dependencies]
eframe = "0.35"
egui = "0.35"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
egui_kittest = "0.35"
tempfile = "3"
